<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>새벽 3시: 1인칭 3D</title>
<style>
*{box-sizing:border-box} :root{--red:#f04452;--white:#f6f4f5}
body{margin:0;background:#050609;color:var(--white);font-family:system-ui,"Malgun Gothic",sans-serif;overflow:hidden}
#game{height:100dvh;width:100vw;position:relative;background:#08090d;isolation:isolate}
#scene{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#111625 0%,#191721 48%,#090a0e 100%);transition:filter .5s}
#scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#030406 0%,transparent 28%,transparent 70%,#020307 100%),radial-gradient(ellipse at center,transparent 22%,#000a 100%);z-index:15}

.moon{position:absolute;right:12%;top:10%;width:clamp(45px,8vw,95px);aspect-ratio:1;border-radius:50%;background:#c5c9d3;box-shadow:0 0 50px #a8b9dc55}
.building{position:absolute;bottom:25%;background:#090b12;border:1px solid #222532}
.building.one{left:0;width:23%;height:42%;clip-path:polygon(0 9%,80% 0,100% 100%,0 100%)}
.building.two{left:20%;width:28%;height:54%;clip-path:polygon(10% 0,85% 6%,100% 100%,0 100%)}
.building.three{right:0;width:30%;height:46%;clip-path:polygon(0 7%,100% 0,100% 100%,10% 100%)}
.window{position:absolute;width:9px;height:13px;background:#d4a45e;opacity:.35;box-shadow:0 0 14px #edb96b}
.ground{position:absolute;bottom:0;height:31%;width:100%;background:linear-gradient(#1b1a22,#050609);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
.pathline{position:absolute;bottom:0;height:30%;width:2px;left:50%;background:#4e4b54;transform-origin:bottom;opacity:.6}
.fog{position:absolute;bottom:16%;height:28%;width:150%;left:-20%;background:linear-gradient(90deg,transparent,#8c8c9b16,transparent);filter:blur(18px);animation:fog 8s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(13%)}}
.door{position:absolute;width:clamp(95px,17vw,180px);height:clamp(175px,34vh,310px);bottom:23%;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#17131a,#2b2229 50%,#100f16);border:5px solid #37303a;box-shadow:0 0 30px #000;transform-origin:left center;z-index:3}
.door:before{content:"";position:absolute;inset:10px;border:1px solid #61505b}
.knob{position:absolute;right:15%;top:53%;width:10px;height:10px;background:#c5a16c;border-radius:50%;box-shadow:0 0 12px #e5bc73}
.door.open{animation:doorOpen 1.3s ease-in forwards}
@keyframes doorOpen{to{transform:translateX(-50%) perspective(600px) rotateY(-72deg);filter:brightness(.4)}}
.player{position:absolute;z-index:5;bottom:22%;left:30%;width:clamp(48px,8vw,90px);height:clamp(130px,27vh,230px);transform:translateX(-50%);transition:left 1.4s ease,filter .4s;filter:drop-shadow(0 10px 14px #0009)}
.head{position:absolute;top:0;left:25%;width:50%;aspect-ratio:.85;border-radius:45% 45% 43% 43%;background:linear-gradient(90deg,#a87562,#e0b49b 48%,#9d6b5c);z-index:3}
.hair{position:absolute;top:-5%;left:20%;width:60%;height:24%;background:#17151a;border-radius:60% 60% 20% 20%;z-index:4}
.body{position:absolute;top:24%;left:18%;width:64%;height:42%;background:linear-gradient(90deg,#202c3c,#394b60,#18202c);border-radius:25% 25% 10% 10%;transform-origin:top center}
.arm{position:absolute;top:29%;width:20%;height:35%;background:#b68b77;border-radius:20px;transform-origin:top center}
.arm.left{left:12%;transform:rotate(10deg)}.arm.right{right:12%;transform:rotate(-10deg)}
.leg{position:absolute;top:62%;height:35%;width:25%;background:#171a23;border-radius:12px;transform-origin:top center}
.leg.left{left:23%}.leg.right{right:23%}
.player.walking .leg.left{animation:legL .38s infinite alternate}.player.walking .leg.right{animation:legR .38s infinite alternate}.player.walking .arm.left{animation:armL .38s infinite alternate}.player.walking .arm.right{animation:armR .38s infinite alternate}
@keyframes legL{to{transform:rotate(28deg) translateY(-3px)}}@keyframes legR{to{transform:rotate(-28deg) translateY(-3px)}}@keyframes armL{to{transform:rotate(-24deg)}}@keyframes armR{to{transform:rotate(24deg)}}
.player.scared{animation:shake .12s infinite alternate}.player.crouch{transform:translateX(-50%) scaleY(.55);transform-origin:bottom}
@keyframes shake{to{translate:3px 0}}
.monster{position:absolute;z-index:6;bottom:20%;right:8%;width:clamp(60px,11vw,120px);height:clamp(200px,42vh,360px);opacity:0;transform:translateY(35px) scale(.9);transition:opacity .6s,transform .8s;filter:drop-shadow(0 0 18px #d0001c55)}
.monster.show{opacity:1;transform:translateY(0) scale(1)}
.mhead{position:absolute;top:0;left:18%;width:64%;height:24%;border-radius:48% 48% 38% 38%;background:#08070a}
.mbody{position:absolute;top:20%;left:10%;width:80%;height:57%;background:linear-gradient(90deg,#07070a,#171016,#030305);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}
.meye{position:absolute;top:12%;left:28%;width:9px;height:5px;background:#ff1738;box-shadow:18px 0 #ff1738,0 0 15px #ff001e,18px 0 15px #ff001e;z-index:2}
.mleg{position:absolute;bottom:0;width:22%;height:28%;background:#050508}.mleg.l{left:24%}.mleg.r{right:24%}
.light{position:absolute;inset:0;background:radial-gradient(ellipse at 45% 50%,#f8e3a51c,transparent 38%);z-index:7;pointer-events:none;transition:opacity .5s}
.bloodflash{position:absolute;inset:0;background:#b50020;z-index:30;opacity:0;pointer-events:none}
.bloodflash.hit{animation:hit .45s}@keyframes hit{20%{opacity:.65}100%{opacity:0}}
.hud{position:absolute;z-index:20;top:0;left:0;right:0;padding:clamp(14px,3vw,28px);display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.16em;color:#c6c4ce}
.brand{font-weight:900}.time{border:1px solid #ffffff30;border-radius:30px;padding:8px 12px;background:#08091099}
.dialogue{position:absolute;z-index:22;bottom:0;left:0;right:0;padding:clamp(20px,4vw,42px);padding-top:55px;background:linear-gradient(transparent,#030407 22%,#030407f5);min-height:35%}
.chapter{color:var(--red);font-size:11px;font-weight:900;letter-spacing:.2em;margin-bottom:8px}
h1{font-size:clamp(22px,4vw,34px);margin:0 0 10px;line-height:1.2}
p{font-size:clamp(14px,2vw,17px);line-height:1.75;color:#d5d2da;white-space:pre-line;max-width:850px;margin:0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;max-width:900px}
.choice{min-height:56px;text-align:left;padding:13px 16px;background:#17171f;border:1px solid #45434d;color:#f5f2f3;border-radius:10px;font-weight:700;font-size:14px;transition:.2s}
.choice:hover,.choice:focus{border-color:#f04452;background:#2b171e;transform:translateY(-2px)}
.choice b{color:#f04452;margin-right:10px}
#intro,#ending{position:absolute;z-index:40;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:25px;background:radial-gradient(ellipse at 50% 40%,#1a1824,#050609 70%)}
#intro h1{font-size:clamp(48px,11vw,100px);letter-spacing:-.07em;text-shadow:0 0 35px #f0445244}
#intro p,#ending p{max-width:620px}
.kicker{color:var(--red);letter-spacing:.3em;font-size:12px;font-weight:900;margin-bottom:18px}
.start{margin-top:25px;border:0;border-radius:10px;background:var(--red);color:white;padding:15px 28px;font-weight:900;font-size:16px;cursor:pointer}
.small{font-size:11px;color:#85828d;margin-top:20px}
#ending{display:none}
#ending h1{margin-bottom:18px}
@media(max-width:560px){.choices{grid-template-columns:1fr;gap:8px;margin-top:14px}.choice{min-height:46px;padding:10px 12px}.dialogue p{font-size:14px}.hud{padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px}.dialogue{max-height:64vh;max-height:64dvh}}

/* ---- v2 ---- */
#game{height:100vh;height:100dvh}
#scene{bottom:var(--dh,0px)}

.cloud{position:absolute;top:5%;left:-10%;width:70%;height:24%;background:radial-gradient(ellipse at 30% 50%,#0b0d1699,transparent 60%),radial-gradient(ellipse at 70% 40%,#0a0c14aa,transparent 60%);filter:blur(10px);animation:cloud 40s linear infinite alternate}@keyframes cloud{to{transform:translateX(40%)}}
.window:nth-child(3n){animation:wf 5s infinite}.window:nth-child(4n){animation-delay:-2s}@keyframes wf{0%,90%,100%{opacity:.35}93%{opacity:0}96%{opacity:.65}}
.lamp{position:absolute;left:12%;bottom:23%;width:4px;height:36%;background:#15161d;z-index:2}

@keyframes lamp{0%,40%,100%{opacity:1}43%{opacity:.15}46%{opacity:.9}48%{opacity:.1}52%{opacity:1}}
.puddle{position:absolute;bottom:7%;left:36%;width:26%;height:5%;border-radius:50%;background:radial-gradient(ellipse,#7d8fbd55,transparent 70%);z-index:1;animation:pd 5s ease-in-out infinite alternate}@keyframes pd{to{transform:scaleX(1.12);opacity:.6}}
.rain{position:absolute;inset:0;z-index:14;pointer-events:none;opacity:.55;background:repeating-linear-gradient(103deg,transparent 0 14px,#9db4dd30 14px 15px,transparent 15px 31px) 0 0/200px 200px,repeating-linear-gradient(103deg,transparent 0 23px,#9db4dd22 23px 24px,transparent 24px 47px) 0 0/300px 300px;animation:rain .55s linear infinite}
@keyframes rain{to{background-position:-30px 200px,-45px 300px}}
.grain{position:absolute;inset:-50%;z-index:16;pointer-events:none;opacity:.1;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain .6s steps(4) infinite}
@keyframes grain{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(3%,3%)}}
.vig{position:absolute;inset:0;z-index:16;pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse at center,transparent 35%,#5a000fdd 100%)}
.fear1 .vig{opacity:.5}.fear2 .vig{opacity:1;animation:vp 1s ease-in-out infinite alternate}@keyframes vp{to{opacity:.6}}
#fade{position:absolute;inset:0;background:#000;z-index:19;opacity:0;pointer-events:none;transition:opacity .45s}#fade.on{opacity:1}
.flicker{animation:flick .8s steps(1) 1}@keyframes flick{0%{filter:brightness(1)}10%{filter:brightness(.15)}20%{filter:brightness(1.6)}30%{filter:brightness(.25)}45%{filter:brightness(1)}60%{filter:brightness(.35)}75%{filter:brightness(1)}}
.shk{animation:shk .45s}.shk-l{animation:shk .25s 4}
@keyframes shk{0%,100%{translate:0 0;scale:1}15%{translate:-7px 4px;scale:1.04}30%{translate:6px -5px;scale:1.04}45%{translate:-5px -3px;scale:1.04}60%{translate:4px 4px;scale:1.03}80%{translate:-2px 1px;scale:1.01}}
.door{height:clamp(120px,calc(var(--sh,600px)*.55),310px);width:clamp(70px,calc(var(--sh,600px)*.3),180px)}
/* player */
.player{height:clamp(100px,calc(var(--sh,600px)*.4),230px);width:clamp(40px,calc(var(--sh,600px)*.15),90px);transition:left 1.5s cubic-bezier(.45,.05,.3,1),bottom .7s ease-in,filter .4s,scale .25s;animation:idle 3.4s ease-in-out infinite}
@keyframes idle{50%{translate:0 -1.5px}}
.player:before{content:"";position:absolute;left:-10%;bottom:-3%;width:120%;height:7%;border-radius:50%;background:radial-gradient(#000c,transparent 70%)}
.head:before,.head:after{content:"";position:absolute;top:46%;width:13%;aspect-ratio:1;border-radius:50%;background:#1b1115;animation:blink 4s infinite}.head:before{left:24%}.head:after{right:24%}
@keyframes blink{0%,94%,100%{scale:1 1}97%{scale:1 .1}}
.player.scared .head:before,.player.scared .head:after{width:18%;top:42%;background:#0b0508;box-shadow:0 0 0 2px #f6f4f5}
.hair{border-radius:55% 55% 25% 25%}.hair:after{content:"";position:absolute;left:-6%;top:60%;width:22%;height:90%;background:#17151a;border-radius:0 0 60% 60%}
.body:before{content:"";position:absolute;left:48%;top:6%;width:3%;height:90%;background:#0e141d}
.body:after{content:"";position:absolute;left:0;top:0;width:100%;height:14%;background:#4b6078;border-radius:inherit;opacity:.6}
.leg:after{content:"";position:absolute;bottom:-3%;left:-15%;width:130%;height:14%;background:#0a0b10;border-radius:40% 60% 20% 20%}
.player.run{--sp:.26s}
.player.walking{animation:bob var(--sp,.42s) ease-in-out infinite}@keyframes bob{50%{translate:0 -4px}}
.player.walking .leg.left{animation:legL var(--sp,.42s) ease-in-out infinite alternate}
.player.walking .leg.right{animation:legR var(--sp,.42s) ease-in-out infinite alternate}
.player.walking .arm.left{animation:armL var(--sp,.42s) ease-in-out infinite alternate}
.player.walking .arm.right{animation:armR var(--sp,.42s) ease-in-out infinite alternate}
.player.walking .body{animation:sway calc(var(--sp,.42s)*2) ease-in-out infinite}
.player.run .body{rotate:7deg}
@keyframes legL{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes legR{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
@keyframes armL{from{transform:rotate(26deg)}to{transform:rotate(-22deg)}}
@keyframes armR{from{transform:rotate(-26deg)}to{transform:rotate(22deg)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
/* monster */
.monster{height:clamp(150px,calc(var(--sh,600px)*.7),360px);width:clamp(50px,calc(var(--sh,600px)*.2),120px);transition:opacity .5s,transform .9s cubic-bezier(.2,.8,.2,1),right 1.2s cubic-bezier(.45,.05,.3,1),filter .4s}
.monster:before{content:"";position:absolute;inset:-12% -60% -4%;background:radial-gradient(ellipse at 50% 35%,#c4001a44,transparent 65%);z-index:-1}
.monster.show{animation:appear .9s both,float 3.5s ease-in-out .9s infinite}
@keyframes appear{0%{opacity:0;scale:.7 1.3;filter:brightness(4) drop-shadow(0 0 30px #f04452)}30%{opacity:1;scale:1.1 .92}60%{opacity:.3}70%{opacity:1}100%{opacity:1;scale:1}}
@keyframes float{50%{translate:0 -8px;rotate:1.2deg}}
.mhead{box-shadow:inset 0 -10px 20px #000}
.mhead:after{content:"";position:absolute;left:18%;right:18%;top:62%;height:22%;background:repeating-linear-gradient(90deg,#e8e2e6 0 2px,transparent 2px 5px);clip-path:polygon(0 0,100% 0,50% 100%);opacity:.85;animation:grin 2.4s ease-in-out infinite alternate}@keyframes grin{to{height:34%}}
.meye{width:11px;height:6px;box-shadow:22px 0 #ff1738,0 0 18px #ff001e,22px 0 18px #ff001e;animation:eyef 3s infinite}@keyframes eyef{0%,92%,100%{opacity:1}94%{opacity:.1}96%{opacity:1}}
.marm{position:absolute;top:22%;width:8%;height:64%;background:linear-gradient(#0a090c,#040406);border-radius:8px;transform-origin:top center;z-index:1}

<body>
<div id="game">
<div id="scene"><div class="grain"></div><div class="vig"></div><div id="fade"></div></div>
<div class="hud"><div class="brand">새벽 3시 <span style="color:#ffa8b4">/ 1인칭 3D</span></div><div class="time" id="time">03:00 AM</div></div>
<div class="dialogue" id="dialogue" style="display:none"><div class="chapter" id="chapter"></div><h1 id="title"></h1><p id="text"></p><div class="choices" id="choices"></div></div>
<section id="intro"><div class="kicker">FIRST-PERSON CHOICE HORROR</div><h1>새벽 3시</h1><p>막차가 끊긴 밤. 낯선 골목 끝에서 문 하나가 천천히 열린다.<br>네가 선택하면 주인공이 직접 움직인다.</p><button class="start" id="startButton" type="button">▶ 게임 시작</button><div class="small">화면 속 움직임과 장면 전환이 포함된 스토리 게임</div></section>
<section id="ending"><div class="kicker">STORY COMPLETE</div><h1 id="endtitle">끝</h1><p id="endtext"></p><button class="start" id="restartButton" type="button">↻ 처음부터 다시</button></section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>const $=id=>document.getElementById(id);
const DG=$('dialogue'),FD=$('fade'),S=$('scene');
let busy=false,timers=[];
const later=(f,ms)=>timers.push(setTimeout(f,ms));
const clearT=()=>{timers.forEach(clearTimeout);timers=[]};
const wait=ms=>new Promise(r=>setTimeout(r,ms));

let AC,NB,ls=0,tI=0;
function audio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();const g=AC.createGain();g.gain.value=.07;g.connect(AC.destination);
[55,55.7,82.4].forEach(f=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;const l=AC.createBiquadFilter();l.type='lowpass';l.frequency.value=180;o.connect(l);l.connect(g);o.start()});
NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const s=AC.createBufferSource(),h=AC.createBiquadFilter(),v=AC.createGain();s.buffer=NB;s.loop=true;h.type='highpass';h.frequency.value=1800;v.gain.value=.025;s.connect(h);h.connect(v);v.connect(AC.destination);s.start()}catch(e){AC=null}}
function tone(f1,f2,d,g,ty){if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),v=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);v.gain.setValueAtTime(g,n);v.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(v);v.connect(AC.destination);o.start();o.stop(n+d)}
function puff(d,g,fq){if(!AC)return;const n=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain();s.buffer=NB;f.type='lowpass';f.frequency.value=fq;v.gain.setValueAtTime(g,n);v.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(v);v.connect(AC.destination);s.start();s.stop(n+d)}

function showScene(id){
const s=scenes[id];if(!s)return;
if(s.end){DG.style.display='none';sync();animate('');$('endtitle').textContent=s.title;$('endtext').textContent=s.text;const e=$('ending');e.style.display='flex';e.scrollTop=0;return}
$('chapter').textContent=s.chapter;$('title').textContent=s.title;typeText($('text'),s.text);$('time').textContent=s.time;
const c=$('choices');c.innerHTML='';c.classList.add('wait');
s.choices.forEach((x,i)=>{const b=document.createElement('button');b.className='choice';b.type='button';const n=document.createElement('b');n.textContent=i+1;b.append(n,x[0]);b.onclick=()=>pick(x[1],b);c.appendChild(b)});
DG.style.display='block';DG.scrollTop=0;sync();animate(s.action);
}
async function pick(next,btn){
if(busy)return;busy=true;
btn.classList.add('picked');DG.querySelectorAll('.choice').forEach(q=>q.disabled=true);
DG.classList.add('out');FD.classList.add('on');
await wait(550);showScene(next);await wait(80);
FD.classList.remove('on');DG.classList.remove('out');
await wait(450);busy=false;
}
async function startGame(){
if(busy)return;busy=true;audio();st.cz=st.czt=3.2;st.inside=false;st.mz=-3;
FD.style.transition='none';FD.classList.add('on');void FD.offsetWidth;FD.style.transition='';
$('intro').style.display='none';$('ending').style.display='none';
DG.classList.add('out');showScene('start');
await wait(120);FD.classList.remove('on');DG.classList.remove('out');
await wait(450);busy=false;
}
$('startButton').onclick=startGame;$('restartButton').onclick=startGame;
document.addEventListener('keydown',e=>{if(busy||DG.style.display!=='block'||$('choices').classList.contains('wait'))return;const b=DG.querySelectorAll('.choice')[+e.key-1];if(b&&!b.disabled)b.click()});
addEventListener('resize',sync);if(window.ResizeObserver)new ResizeObserver(sync).observe(DG);sync();

setInterval(()=>{if(AC&&st.fear&&busy===false){tone(70,40,.18,.5);setTimeout(()=>tone(60,35,.16,.35),170)}},800);
const mb2=document.createElement('button');mb2.textContent='🔊';mb2.style.cssText='position:absolute;right:12px;top:calc(56px + env(safe-area-inset-top,0px));z-index:21;background:#0006;border:0;color:#fff;border-radius:50%;width:36px;height:36px;font-size:16px';
mb2.onclick=()=>{if(!AC)return;if(AC.state==='running'){AC.suspend();mb2.textContent='🔇'}else{AC.resume();mb2.textContent='🔊'}};$('game').appendChild(mb2);
loop();</script>
